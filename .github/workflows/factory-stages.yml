name: Factory stages

# When the repository owner moves an issue through a gate, start the cloud scheduled task that runs
# the next stage (thanhwoe/solo-factory docs/routines/intake-spec.md, ADR-010 there):
#   `ready` → intake and spec, `spec-ok` → plan and QA step 1, `plan-ok` → build (and QA step 1 in
#   the small lane, which has no `spec-ok`), a same-repo PR opening that closes an issue labelled
#   `qa` → QA step 2, and a merged same-repo PR that closes an issue here → retro. "Closes" is
#   GitHub's closing issues, not the PR's text (ADR-013 there for QA).
# `mac-build`, which a cloud build adds when it stops at a `mac` step, starts a second scheduled
#   task on the Mac mini instead (docs/routines/mac-build.md, ADR-015 there).
# When a factory PR's checks fail (a `feat/` or `fix/` branch that closes an issue), the last of its
#   CI, PR evidence and Mobile E2E runs to finish starts `fix <PR>`: on the Mac mini when Mobile E2E
#   failed, else in the cloud (ADR-016 there). One fire per push, whichever run finishes last.
#   It counts ci-fix's tries first, with the kit's own script: none after two, none on a commit a
#   try already judged (solo-factory#43).
# It filters here, so other events start no session. The secrets keep their first names.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, closed]
  workflow_run:
    workflows: ["CI", "PR evidence", "Mobile E2E"]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: factory-stages-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  fire:
    if: >-
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issues' && !github.event.issue.pull_request &&
          contains(fromJSON('["ready", "spec-ok", "plan-ok", "mac-build"]'), github.event.label.name)) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.merged ||
            (github.event.action == 'opened' && !startsWith(github.event.pull_request.head.ref, 'qa/')))) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (startsWith(github.event.workflow_run.head_branch, 'feat/') ||
            startsWith(github.event.workflow_run.head_branch, 'fix/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the kit's scripts, from the default branch: ci-fix's tries are counted with them.
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@v5
        with:
          sparse-checkout: .claude/factory-kit
          persist-credentials: false
      - name: Pick the stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HAS_QA: ${{ contains(github.event.issue.labels.*.name, 'qa') }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One stage per line: spec-ok starts the plan and QA step 1 side by side.
          case "$EVENT:$LABEL" in
            issues:ready) text="spec $ISSUE" ;;
            issues:mac-build) text="build $ISSUE"; routine=mac ;;
            issues:spec-ok) text=$(printf 'plan %s\nqa %s' "$ISSUE" "$ISSUE") ;;
            issues:plan-ok)
              # The small lane has no spec-ok, so QA starts here unless step 1 already labelled it.
              text="build $ISSUE"
              [ "$HAS_QA" = true ] || text=$(printf '%s\nqa %s' "$text" "$ISSUE")
              ;;
            pull_request:*)
              # GitHub's own list of the issues this PR closes, in this repository only. Reading
              # the body fired a retro for #112 from a PR that only quoted "Closes #112" (#124).
              n=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
                --jq "[.closingIssuesReferences[] | select(.url | startswith(\"https://github.com/$REPO/issues/\")) | .number] | first // empty")
              if [ -z "$n" ]; then
                echo "::notice::The PR closes no issue here, so no stage."
              elif [ "$ACTION" = opened ]; then
                # QA step 2 only for an issue QA step 1 labelled.
                if gh api "repos/$REPO/issues/$n" --jq '[.labels[].name] | index("qa")' | grep -q '^[0-9]'; then
                  text="qa $n"
                else
                  echo "::notice::Issue #$n has no qa label, so no QA step 2."
                fi
              else
                text="retro $n"
              fi
              ;;
            workflow_run:*)
              # Once per push: the last of the PR's check workflows to finish decides, and fires
              # only if one of them failed. A run that finishes earlier leaves it to that one.
              runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "CI" or .name == "PR evidence" or .name == "Mobile E2E")]')
              pr=${RUN_PR:-$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')}
              if jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
                echo "::notice::Another check is still running on $SHA; the last one to finish decides."
              elif [ "$(jq -r 'max_by(.updated_at) | .id' <<<"$runs")" != "$RUN_ID" ]; then
                echo "::notice::Another check finished later on $SHA; it decides."
              elif ! jq -e 'any(.[]; .conclusion == "failure")' <<<"$runs" >/dev/null; then
                echo "::notice::No check failed on $SHA."
              elif [ -z "$pr" ]; then
                echo "::notice::No open PR for $SHA."
              else
                # The issue it closes, in this repository only, as for retro.
                n=$(gh pr view "$pr" --repo "$REPO" --json closingIssuesReferences \
                  --jq "[.closingIssuesReferences[] | select(.url | startswith(\"https://github.com/$REPO/issues/\")) | .number] | first // empty")
                if [ -z "$n" ]; then
                  echo "::notice::PR #$pr closes no issue, so it isn't a factory PR to fix."
                else
                  # ci-fix's tries, counted from its markers on the issue the way the skill counts.
                  comments="$RUNNER_TEMP/comments-$n.ndjson"
                  gh api --paginate "repos/$REPO/issues/$n/comments" --jq '.[]' > "$comments"
                  tries=$(node .claude/factory-kit/scripts/factory-marker.mjs tries "$comments" "$pr" "$SHA")
                  if [ "$(jq .tries <<<"$tries")" -ge 2 ]; then
                    echo "::notice::ci-fix has made two tries on PR #$pr, and the second one handed over."
                  elif jq -e .sha_tried <<<"$tries" >/dev/null; then
                    echo "::notice::A ci-fix try already judged $SHA on PR #$pr."
                  else
                    text="fix $pr"
                    # Maestro needs the Simulator: a failed Mobile E2E goes to the Mac mini.
                    jq -e 'any(.[]; .name == "Mobile E2E" and .conclusion == "failure")' <<<"$runs" >/dev/null && routine=mac
                  fi
                fi
              fi
              ;;
          esac
          {
            echo "routine=${routine:-stages}"
            echo 'text<<EOF'
            echo "${text:-}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Fire the routine
        if: steps.stage.outputs.text != ''
        env:
          # Picked in the script, not with `a && b || c`: that falls back to the cloud task's secrets
          # when the Mac mini's are empty, and sent #134's `mac-build` to the cloud.
          STAGES_URL: ${{ secrets.INTAKE_SPEC_FIRE_URL }}
          STAGES_TOKEN: ${{ secrets.INTAKE_SPEC_FIRE_TOKEN }}
          MAC_URL: ${{ secrets.MAC_BUILD_FIRE_URL }}
          MAC_TOKEN: ${{ secrets.MAC_BUILD_FIRE_TOKEN }}
          ROUTINE: ${{ steps.stage.outputs.routine }}
          TEXT: ${{ steps.stage.outputs.text }}
          # The /fire endpoint is in research preview; a breaking change ships under a new header.
          ROUTINE_BETA: experimental-cc-routine-2026-04-01
        run: |
          # `mac-build` goes to the Mac mini's task, everything else to the cloud one.
          if [ "$ROUTINE" = mac ]; then
            FIRE_URL=$MAC_URL FIRE_TOKEN=$MAC_TOKEN
          else
            FIRE_URL=$STAGES_URL FIRE_TOKEN=$STAGES_TOKEN
          fi
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            if [ "$ROUTINE" = mac ]; then
              echo "::warning::MAC_BUILD_FIRE_URL or MAC_BUILD_FIRE_TOKEN is not set, so the Mac mini build didn't start. Run /factory-build with --from on the Mac mini."
            else
              echo "::warning::INTAKE_SPEC_FIRE_URL or INTAKE_SPEC_FIRE_TOKEN is not set, so no session started."
            fi
            exit 0
          fi
          while IFS= read -r stage; do
            [ -n "$stage" ] || continue
            response=$(curl -sS --fail-with-body -X POST "$FIRE_URL" \
              -H "Authorization: Bearer $FIRE_TOKEN" \
              -H "anthropic-beta: $ROUTINE_BETA" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$stage" '{text: $text}')")
            echo "Session for '$stage': $(jq -r .claude_code_session_url <<<"$response")"
          done <<<"$TEXT"
