name: Factory stages

# When the repository owner moves an issue through a gate, start the cloud scheduled task that runs
# the next stage (thanhwoe/solo-factory docs/routines/intake-spec.md, ADR-010 there):
#   `ready` → intake and spec, `spec-ok` → plan, `plan-ok` → build,
#   a merged same-repo PR that says `Closes #<N>` → retro.
# It filters here, so other events start no session. The secrets keep their first names.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: factory-stages-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fire:
    if: >-
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issues' && !github.event.issue.pull_request &&
          contains(fromJSON('["ready", "spec-ok", "plan-ok"]'), github.event.label.name)) ||
        (github.event_name == 'pull_request' && github.event.pull_request.merged &&
          github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pick the stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$EVENT:$LABEL" in
            issues:ready) text="spec $ISSUE" ;;
            issues:spec-ok) text="plan $ISSUE" ;;
            issues:plan-ok) text="build $ISSUE" ;;
            pull_request:*)
              # Only `Closes #<N>` in this repo: "closes owner/other#<N>" names another repository.
              n=$(grep -oiE '(^|[^/[:alnum:]])closes #[0-9]+' <<<"$PR_BODY" | head -n 1 | grep -oE '[0-9]+$' || true)
              text=${n:+retro $n}
              [ -n "$text" ] || echo "::notice::The PR closes no issue here, so no retro."
              ;;
          esac
          echo "text=${text:-}" >> "$GITHUB_OUTPUT"
      - name: Fire the routine
        if: steps.stage.outputs.text != ''
        env:
          FIRE_URL: ${{ secrets.INTAKE_SPEC_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.INTAKE_SPEC_FIRE_TOKEN }}
          TEXT: ${{ steps.stage.outputs.text }}
          # The /fire endpoint is in research preview; a breaking change ships under a new header.
          ROUTINE_BETA: experimental-cc-routine-2026-04-01
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "::warning::INTAKE_SPEC_FIRE_URL or INTAKE_SPEC_FIRE_TOKEN is not set, so no session started."
            exit 0
          fi
          response=$(curl -sS --fail-with-body -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: $ROUTINE_BETA" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$TEXT" '{text: $text}')")
          echo "Session for '$TEXT': $(jq -r .claude_code_session_url <<<"$response")"
