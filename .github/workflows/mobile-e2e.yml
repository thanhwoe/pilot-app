name: Mobile E2E

# Runs the Maestro flows on the Mac mini runner. A separate workflow from ci.yml because `paths:`
# filters apply to a whole workflow: the check appears only on PRs that touch these paths.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - apps/api/**

# Never add `pull_request_target` or `workflow_run` here, and never reference a secret: this job
# runs on a machine we own.
permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e:
    # A fork's code must not run on the self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, macos-sim]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A launchd-started runner has a short PATH, without Docker's CLI.
      - name: Put Docker on PATH
        run: echo "$HOME/.docker/bin" >> "$GITHUB_PATH"
      - name: Start Postgres
        run: pnpm db:up
      # Both runs go through scripts/e2e-lock.sh, which waits for any other end-to-end run on the
      # machine and says so in the log. run.sh overwrites api.log, so each run's copy is kept. The
      # exit code is kept too: the Android run still happens after an iOS failure, and the job
      # fails if either failed.
      - name: Maestro flows on iOS
        run: |
          status=0
          pnpm --filter @gop/mobile e2e:ios || status=$?
          mkdir -p "$RUNNER_TEMP/e2e-out"
          cp apps/mobile/e2e/api.log "$RUNNER_TEMP/e2e-out/api-ios.log" || true
          exit "$status"
      - name: Maestro flows on Android
        if: ${{ !cancelled() }}
        run: |
          status=0
          pnpm --filter @gop/mobile e2e:android || status=$?
          mkdir -p "$RUNNER_TEMP/e2e-out"
          cp apps/mobile/e2e/api.log "$RUNNER_TEMP/e2e-out/api-android.log" || true
          exit "$status"
