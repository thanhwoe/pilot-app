name: Board sync

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]

concurrency:
  group: board-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Mirror the workflow label onto the board
        env:
          # A classic token with the `project` and `repo` scopes. Fine-grained tokens and
          # GITHUB_TOKEN can't reach a project owned by a user account.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
          # "@me" is the token's own account. It skips gh's owner-type lookup, which failed in
          # Actions with "unknown owner type".
          PROJECT_OWNER: "@me"
          PROJECT_NUMBER: "1"
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN is not set, so the board was not updated."
            exit 0
          fi
          bash .github/scripts/board-sync.sh
