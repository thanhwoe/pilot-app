name: Issue labels

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Swap building for review on the issues this PR closes
        env:
          # PROJECT_TOKEN, not GITHUB_TOKEN: a label change made with GITHUB_TOKEN starts no
          # workflow, so Board sync would never see it.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN is not set, so the labels were not changed."
            exit 0
          fi
          issues=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$BODY" | grep -oE '[0-9]+' | sort -u || true)
          for n in $issues; do
            if ! gh api "repos/$REPO/issues/$n/labels" --jq '.[].name' | grep -qx building; then
              echo "#$n has no building label; left as it is."
              continue
            fi
            gh api -X DELETE "repos/$REPO/issues/$n/labels/building" >/dev/null
            gh api "repos/$REPO/issues/$n/labels" -f 'labels[]=review' >/dev/null
            echo "#$n: building → review"
          done
