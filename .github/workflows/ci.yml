name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR's CI tests the PR merged into main as it was when the PR last changed. When another PR
  # lands first, those results are stale: #31 and #20 each passed alone and broke main together
  # (#21 retro). Fail until the PR contains the current main, so CI runs again on the combination.
  up-to-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: The branch contains the latest main
        run: |
          git fetch origin "${{ github.base_ref }}"
          git merge-base --is-ancestor "origin/${{ github.base_ref }}" HEAD || {
            echo "::error::${{ github.base_ref }} has moved. Merge it into this branch; CI then runs again on the combination."
            exit 1
          }

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gop
          POSTGRES_PASSWORD: gop
          POSTGRES_DB: gop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gop -d gop"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://gop:gop@localhost:5432/gop
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm turbo run build --filter=@gop/web
      # Bundles the mobile JavaScript the way a Release build does, so a module the bundle can't
      # resolve (such as a test file under src/app, #23) fails here and not on the Mac mini.
      - run: pnpm --filter @gop/mobile exec expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/mobile-bundle"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gop
          POSTGRES_PASSWORD: gop
          POSTGRES_DB: gop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gop -d gop"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      E2E_DATABASE_URL: postgres://gop:gop@localhost:5432/gop_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gop/web exec playwright install --with-deps chromium
      - run: pnpm --filter @gop/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
