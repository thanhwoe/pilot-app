name: PR evidence

# Fails while a PR description still has screenshot placeholders, so a UI change can't be merged
# without its evidence. From the retro of #7, whose PR shipped with placeholders only.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No screenshot placeholders in the description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -q '<!-- screenshot' <<<"$BODY"; then
            echo "::error::The PR description still has '<!-- screenshot' placeholders. Commit the screenshots to docs/evidence/<N>/ and embed them, or write 'not captured: <reason>' instead."
            exit 1
          fi
          echo "No screenshot placeholders."

      # From the retro of #14, whose PR merged with "- [ ] CI: not run yet (the branch hasn't been
      # pushed)": the description was written before the push and never updated.
      - name: No unchecked boxes in the description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -nE '^\s*[-*] \[ \]' <<<"$BODY"; then
            echo "::error::The PR description has unchecked boxes (above). Run the check and tick it, or write 'Not run: <what>, because <why>' without a box. GitHub already shows CI, so don't list it."
            exit 1
          fi
          echo "No unchecked boxes."

      # From the retro of #74, whose PR merged with "Not run yet" in every row of its runner
      # evidence table: evidence still to come, written so that the two checks above pass.
      - name: No evidence still to come
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -inE '(^|[|])[[:space:]]*([-*][[:space:]]+)?(\*\*)?not run yet' <<<"$BODY"; then
            echo "::error::The PR description says some evidence is not run yet (above). Collect it and update the description, or keep the PR in draft until then. If it can't be collected, write 'Not run: <what>, because <why>'."
            exit 1
          fi
          echo "No evidence still to come."

      # From agilab-console#3, whose screenshots were linked as `[](docs/evidence/...)`: a relative
      # link in a PR description resolves against the PR's page, so GitHub showed no image. The
      # pr-describer agent embeds them as https://github.com/<owner>/<repo>/blob/<sha>/...?raw=true.
      - name: Evidence images use links that resolve
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -nE '\]\(\.?/?docs/evidence/' <<<"$BODY"; then
            echo "::error::The PR description links evidence with a relative path (above), which GitHub can't resolve in a description. Embed each image as ![<step>](https://github.com/${{ github.repository }}/blob/<sha>/docs/evidence/<N>/<file>?raw=true)."
            exit 1
          fi
          echo "Evidence links resolve."

      # From agilab-console#6, whose description the build wrote inline instead of with
      # describe-pr: no risk tier and no reading estimate, so gate 3 couldn't be measured
      # (solo-factory#47). Turned on after agilab-console#13, the first PR from kit 0.44.0,
      # had both lines.
      - name: Risk tier and reading estimate in the description
        if: startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ok=true
          if ! grep -qF '**Risk:**' <<<"$BODY"; then
            echo "::error::The PR description has no '**Risk:**' line."
            ok=false
          fi
          if ! grep -qE 'takes about [0-9][^ ]* minutes?' <<<"$BODY"; then
            echo "::error::The PR description has no 'takes about <N> minutes' reading estimate."
            ok=false
          fi
          if [ "$ok" = false ]; then
            echo "::error::Write the description with describe-pr (the pr-describer agent), not by hand."
            exit 1
          fi
          echo "Risk tier and reading estimate found."
