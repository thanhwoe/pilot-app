name: PR evidence

# Fails while a PR description still has screenshot placeholders, so a UI change can't be merged
# without its evidence. From the retro of #7, whose PR shipped with placeholders only.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No screenshot placeholders in the description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -q '<!-- screenshot' <<<"$BODY"; then
            echo "::error::The PR description still has '<!-- screenshot' placeholders. Commit the screenshots to docs/evidence/<N>/ and embed them, or write 'not captured: <reason>' instead."
            exit 1
          fi
          echo "No screenshot placeholders."

      # From the retro of #14, whose PR merged with "- [ ] CI: not run yet (the branch hasn't been
      # pushed)": the description was written before the push and never updated.
      - name: No unchecked boxes in the description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -nE '^\s*[-*] \[ \]' <<<"$BODY"; then
            echo "::error::The PR description has unchecked boxes (above). Run the check and tick it, or write 'Not run: <what>, because <why>' without a box. GitHub already shows CI, so don't list it."
            exit 1
          fi
          echo "No unchecked boxes."

      # From the retro of #74, whose PR merged with "Not run yet" in every row of its runner
      # evidence table: evidence still to come, written so that the two checks above pass.
      - name: No evidence still to come
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -inE '(^|[|])[[:space:]]*([-*][[:space:]]+)?(\*\*)?not run yet' <<<"$BODY"; then
            echo "::error::The PR description says some evidence is not run yet (above). Collect it and update the description, or keep the PR in draft until then. If it can't be collected, write 'Not run: <what>, because <why>'."
            exit 1
          fi
          echo "No evidence still to come."
