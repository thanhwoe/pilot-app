# throwaway: evidence for #74 AC 1
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gop
      POSTGRES_PASSWORD: gop
      POSTGRES_DB: gop
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gop -d gop"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
