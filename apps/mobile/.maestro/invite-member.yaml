# #98 A3: a member who opens their group's own invite lands on the groups list and nothing
# changes: still one member, no invite screen. The app user makes the group in the app, and the
# script, signed in as the same email, makes its invite.
appId: com.thanhwoe.gop
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/new-email.yaml
- runFlow: subflows/sign-in.yaml
- evalScript: ${output.groupName = 'Da Lat'}
- runFlow: subflows/create-group.yaml
- assertVisible:
    id: group-name
    text: Da Lat
- evalScript: ${output.hostEmail = output.email}
- runScript: scripts/invite-link.js
- runFlow: subflows/open-invite.yaml
- assertVisible:
    id: group-name
    text: Da Lat
- assertVisible:
    id: group-member-count
    text: 1 thành viên
- assertNotVisible:
    id: invite-heading
- assertNotVisible:
    id: invite-join
- evalScript: ${output.platform = maestro.platform.toLowerCase()}
- takeScreenshot: ${output.platform}-invite-member
