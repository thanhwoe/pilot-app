# AC 3, 9: the right code signs me in, and home shows my email.
appId: com.thanhwoe.gop
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/new-email.yaml
- runFlow: subflows/sign-in.yaml
- assertVisible:
    id: signed-in-email
    text: "Đã đăng nhập: ${output.email}"
- assertNotVisible:
    id: email-input
