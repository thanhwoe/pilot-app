# #148 AC 1, 3: a payment line where I am the payer has a "Đã trả" button; tapping it records the
# payment and the screen reloads from the API without leaving the group. The script adds a second
# member and two expenses, so I am at −20.000 and owe them 20.000. After the tap no suggestion is
# left and the screen says the group is settled. Descriptions are ASCII because Maestro can't type
# other text on Android.
appId: com.thanhwoe.gop
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/new-email.yaml
- runFlow: subflows/sign-in.yaml
- evalScript: ${output.groupName = 'Da Lat'}
- runFlow: subflows/create-group.yaml
# The script reads the group from the API, so wait until the app has created it.
- assertVisible:
    id: group-name
    text: Da Lat
- runScript: scripts/other-member-expense.js
- tapOn:
    id: group-row
- assertVisible:
    id: payment-line
    text: Bạn trả ${output.otherEmail} 20.000 ₫
- assertVisible:
    id: pay-button
    text: Đã trả
- evalScript: ${output.platform = maestro.platform.toLowerCase()}
- takeScreenshot: ${output.platform}-settlements-pay
- tapOn:
    id: pay-button
- assertVisible:
    id: balances-settled
- assertNotVisible:
    id: payment-line
- assertNotVisible:
    id: pay-button
- assertVisible:
    id: group-title
    text: Da Lat
- takeScreenshot: ${output.platform}-settlements-pay-after
