# #98 AC 1, 2, #112 AC 1: a signed-in user opens an invite link, sees the group's name and the join
# button, joins, and the group's own screen opens; Back shows the groups list with 2 members. The group and its link are made
# through the API by another user, so the app user is not a member yet. Names are ASCII because
# Maestro can't type other text on Android.
appId: com.thanhwoe.gop
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/new-email.yaml
- runFlow: subflows/sign-in.yaml
- evalScript: ${output.groupName = 'Da Lat'}
- runScript: scripts/invite-link.js
- runFlow: subflows/open-invite.yaml
- assertVisible:
    id: invite-heading
    text: .*Da Lat.*
- assertVisible:
    id: invite-join
    text: Tham gia nhóm
- evalScript: ${output.platform = maestro.platform.toLowerCase()}
- takeScreenshot: ${output.platform}-invite-open
- tapOn:
    id: invite-join
- assertVisible:
    id: group-screen
- assertVisible:
    id: group-title
    text: Da Lat
- assertNotVisible:
    id: invite-heading
- assertNotVisible:
    id: groups-heading
- takeScreenshot: ${output.platform}-invite-joined
- runFlow: subflows/go-back.yaml
- assertVisible:
    id: group-name
    text: Da Lat
- assertVisible:
    id: group-member-count
    text: 2 thành viên
