# [security] AC 18: after 5 wrong tries, even the right code shows the same wrong-code error.
appId: com.thanhwoe.gop
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/new-email.yaml
- runFlow: subflows/request-code.yaml
- runScript: scripts/dev-code.js
- runScript: scripts/wrong-codes.js
- tapOn:
    id: code-input
- inputText: ${output.code}
- tapOn:
    id: sign-in
- assertVisible:
    id: form-error
    text: Mã không đúng hoặc đã hết hạn. Hãy thử lại hoặc yêu cầu mã mới.
- assertNotVisible:
    id: signed-in-email
